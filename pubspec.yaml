name: fitnep
description: "FitNEP nutrition and fitness app for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  cloud_functions: ^7.1.0
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  # 2.3.x uses JNI/CMake and currently hits native metadata file locks on Windows.
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true

  assets:
    - assets/icons/google_g.png
    - assets/images/fitnep_logo.png
    - assets/fonts/Inter-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
