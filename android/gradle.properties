org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# Kotlin incremental caches cannot relativize sources across Windows drives.
# The workspace is on D: while the standard Pub cache is on C:.
kotlin.incremental=false
# Avoid a separate Kotlin JVM on laptops with limited memory.
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
