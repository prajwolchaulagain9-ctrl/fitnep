services:
  - type: web
    name: fitnep-api
    runtime: node
    plan: free
    region: singapore
    branch: development
    rootDir: functions
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: SIGNUP_OTP_HASH_SECRET
        sync: false
      - key: SESSION_IDLE_TIMEOUT_SECONDS
        value: '900'
