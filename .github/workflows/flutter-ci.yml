name: Flutter checks

on:
  push:
    branches: [prajwol, development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  recovery-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: npx --yes firebase-tools@15.32.0 emulators:exec --only auth,functions,firestore --project demo-fitnep --non-interactive "npm --prefix functions run test:emulator"
        env:
          JAVA_TOOL_OPTIONS: '-Xmx384m -XX:ActiveProcessorCount=2'
          FITNEP_RUN_TRIGGER_TESTS: 'true'
      - run: npx --yes firebase-tools@15.32.0 emulators:exec --only auth,firestore --project demo-fitnep --non-interactive "npm --prefix functions run test:packages:emulator"
        env:
          JAVA_TOOL_OPTIONS: '-Xmx384m -XX:ActiveProcessorCount=2'
